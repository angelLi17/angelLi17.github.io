---
layout: default
---
<article class="post blog-post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: site.minima.date_format }}</time>
      {%- if page.edited %} · edited
      <time datetime="{{ page.edited | date_to_xmlschema }}">{{ page.edited | date: site.minima.date_format }}</time>
      {%- endif -%}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <p><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
</article>
